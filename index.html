<!DOCTYPE html>
<html>
<head>
  <title>SIGNED</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>SIGNED</h1>
  <p>Tagalog Sign Language Alphabet</p>
</header>

<div class="search-container">
  <input type="text" id="searchInput" placeholder="Search letter (A-Z)...">
</div>

<div class="grid-container" id="videoGrid">

  <!-- REPEAT THIS BLOCK FOR EACH LETTER -->
  
  <div class="card" data-letter="A">
    <div class="placeholder">A</div>
    <p class="label">Letter A</p>
  </div>

  <div class="card" data-letter="B">
    <div class="placeholder">B</div>
    <p class="label">Letter B</p>
  </div>

  <div class="card" data-letter="C">
    <div class="placeholder">C</div>
    <p class="label">Letter C</p>
  </div>

  <div class="card" data-letter="D">
    <div class="placeholder">D</div>
    <p class="label">Letter D</p>
  </div>

  <div class="card" data-letter="E">
    <div class="placeholder">E</div>
    <p class="label">Letter E</p>
  </div>

  <!-- 👉 Continue until Z -->

</div>

<script>
  const searchInput = document.getElementById("searchInput");
  const cards = document.querySelectorAll(".card");

  searchInput.addEventListener("keyup", function() {
    let value = this.value.toUpperCase();

    cards.forEach(card => {
      let letter = card.getAttribute("data-letter");

      if (letter.includes(value)) {
        card.style.display = "block";
      } else {
        card.style.display = "none";
      }
    });
  });
</script>

</body>
</html>
